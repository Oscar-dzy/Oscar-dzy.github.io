<h2 id="education">Education</h2>
<div class="education-list">
  {% for entry in site.data.education.main %}
  <div class="education-entry">
    <div class="institution-logos{% if entry.logos.size > 1 %} joint-logos{% endif %}">
      {% for logo in entry.logos %}
      <img src="{{ logo.image }}" alt="{{ logo.alt }}" width="64" height="64" loading="lazy">
      {% endfor %}
    </div>
    <div class="education-details">
      <div class="entry-heading">
        <div class="institution-name"><a href="{{ entry.url }}">{{ entry.institution }}</a></div>
        <span class="entry-date">{{ entry.dates }}</span>
      </div>
      {% if entry.partner %}<div class="institution-name"><a href="{{ entry.partner_url }}">{{ entry.partner }}</a></div>{% endif %}
      <div>{{ entry.degree }}</div>
    </div>
  </div>
  {% endfor %}
</div>
